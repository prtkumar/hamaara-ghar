<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>हमारा घर</title>
  <meta name="description" content="विचार, मौन, अध्ययन, सृजन और संवाद को एक साथ रखने वाला एक जीवित घर।">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- बाकी पृष्ठों की पुरानी CSS को नहीं छेड़ा गया है। -->
  <link rel="stylesheet" href="home.css">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="हमारा घर — मुख्य पृष्ठ">
      <img
        src="./logo.png"
        alt="हमारा घर"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
      >
      <span class="brand-fallback" aria-hidden="true">घ</span>
    </a>

    <a class="main-door-button" href="index.html">← मुख्य द्वार</a>
  </header>

  <main>
    <section class="intro-section" aria-labelledby="page-title">
      <p class="eyebrow">एक जीवित गृह-मॉडल</p>
      <h1 id="page-title">हमारा घर</h1>
      <p class="intro-text">
        यह केवल कमरों का नक्शा नहीं—विचार, मौन, अध्ययन, सृजन और संवाद को
        एक साथ रखने वाला घर है।
      </p>
    </section>

    <section class="house-stage" aria-label="हमारा घर के कक्ष">
      <div class="house-card">
        <div class="sun" aria-hidden="true"></div>

        <div class="roof" aria-hidden="true">
          <div class="roof-lines"></div>
          <span class="roof-name">हमारा घर</span>
        </div>

        <div class="house-body">
          <!-- जिन पृष्ठों की फाइल अभी नहीं बनी है, उनके href को # रखा गया है। -->
          <a class="room room-darshan" href="#" aria-label="दर्शन">
            <span class="room-icon sparkle-icon" aria-hidden="true">✨</span>
            <span class="room-title">दर्शन</span>
          </a>

          <a class="room room-courtyard" href="angan.html">
            <span class="tree-mark" aria-hidden="true">
              <span class="tree-crown tree-crown-one"></span>
              <span class="tree-crown tree-crown-two"></span>
              <span class="tree-crown tree-crown-three"></span>
              <span class="tree-trunk"></span>
              <span class="tree-shadow"></span>
            </span>
            <span class="room-title">जीवित आँगन</span>
            <span class="room-note">जहाँ सभी कक्ष मिलते हैं</span>
          </a>

          <a class="room room-beej" href="beej.html" aria-label="बीज">
            <span class="room-icon" aria-hidden="true">🌱</span>
            <span class="room-title">बीज</span>
          </a>

          <a class="room room-library" href="library.html" aria-label="पुस्तकालय">
            <span class="room-icon" aria-hidden="true">📚</span>
            <span class="room-title">पुस्तकालय</span>
          </a>

          <a class="room room-silence" href="#" aria-label="मौन">
            <span class="silence-circle" aria-hidden="true"></span>
            <span class="room-title">मौन</span>
          </a>

          <a class="room room-dialogue" href="samvaad.html" aria-label="संवाद">
            <span class="dialogue-icon" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
            <span class="room-title">संवाद</span>
          </a>
        </div>

        <a class="entrance" href="about.html" aria-label="परिचय — घर को जानने का प्रवेश-द्वार">
          <span class="entrance-title">परिचय</span>
          <span class="entrance-note">घर को जानने का प्रवेश-द्वार</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
